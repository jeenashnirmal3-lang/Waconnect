# Nginx Reverse Proxy Configuration for Jeenash WA Platform
# Domain: wa.jeenashera.online
# Target: AWS EC2 Ubuntu 22.04 LTS

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wa.jeenashera.online;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Reverse Proxy to Node.js Backend & Static SPA Frontend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wa.jeenashera.online;

    # SSL Certificate Paths (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/wa.jeenashera.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.jeenashera.online/privkey.pem;

    # SSL Security Hardening (A+ Rating on SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size for WhatsApp media attachments
    client_max_body_size 50M;

    # Serve built React frontend SPA
    root /var/www/jeenash-wa/dist;
    index index.html;

    # React router catch-all for SPA navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API endpoints routed to Node.js server
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # WebSocket connections for Socket.io and Baileys live sync
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WhatsApp Media Uploads storage folder
    location /uploads/ {
        alias /var/www/jeenash-wa/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Deny access to sensitive files like .env or sessions
    location ~ /\. {
        deny all;
    }
    location /sessions {
        deny all;
        return 404;
    }
}
